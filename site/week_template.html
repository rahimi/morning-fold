<!--
  The Morning Fold: week-ahead template. Build it with `python3 engine/tools/site.py template week`.
  CONTRACT: only the JSON block (script element with id "week") changes from week to week; its content is
  a FICTIONAL SAMPLE (marked "sample": true; drop that key). Keep the CSS, the script and the reply block
  between the REPLY markers as they are. Colours and fonts: the :root custom properties, overridable in the
  instance's site/theme.css.
-->
<title>{{MASTHEAD}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="fold:edition" content="YYYY-MM-DD">
<meta name="fold:lang" content="{{LANG}}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the Sunday "Week ahead" edition. A planner, not a book: one scrolling page.
   Folded: agenda, then watch list, then theses. Unfolded: agenda left, watch list and theses right.
   Content lives in the JSON block #week; the script renders it. */
:root{
  --paper:#f1efe9; --page:#fbfaf7; --ink:#1d1f24; --muted:#66696f; --rule:#d9d5cc; --accent:#2b4c8c;
  --results:#2b6b55; --conference:#2b4c8c; --deadline:#a1462d; --other:#6b5a8c;
  --bar:#dfe5f0; --up:#2b6b55; --down:#a1462d;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101114; --page:#17181c; --ink:#e7e5df; --muted:#9a9a96; --rule:#2d2e33; --accent:#93b1ea;
  --results:#7cc4a6; --conference:#93b1ea; --deadline:#e79a80; --other:#b9a6e3; --bar:#262a33; --up:#7cc4a6; --down:#e79a80; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#101114; --page:#17181c; --ink:#e7e5df; --muted:#9a9a96; --rule:#2d2e33; --accent:#93b1ea;
  --results:#7cc4a6; --conference:#93b1ea; --deadline:#e79a80; --other:#b9a6e3; --bar:#262a33; --up:#7cc4a6; --down:#e79a80; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--ink);padding-bottom:14px}
.mast{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,7vw,60px);line-height:1.02;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent)}
.lede{margin:0;color:var(--muted);font-style:italic;max-width:62ch}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:760px){.grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
section{background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
.day{display:grid;grid-template-columns:3.4em 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.day:first-of-type{border-top:0;padding-top:4px}
.dnum{font-family:var(--display);font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.dname{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.day.quiet .dnum{color:var(--muted)}
.items{display:flex;flex-direction:column;gap:9px;min-width:0}
.item{display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;line-height:1.3}
.item .why{font-size:15px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-right:6px;vertical-align:2px;white-space:nowrap}
.k-results{color:var(--results)} .k-conference{color:var(--conference)} .k-deadline,.k-regulatory{color:var(--deadline)} .k-other,.k-appointment{color:var(--other)}
.unconf{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:4px}
.none{font-size:15px;color:var(--muted);font-style:italic}
.later{font-size:15px;display:flex;flex-direction:column;gap:6px}
.later b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
ol.watch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:w}
ol.watch li{counter-increment:w;display:grid;grid-template-columns:1.6em 1fr;gap:8px}
ol.watch li::before{content:counter(w);font-family:var(--display);font-size:24px;line-height:1;color:var(--accent)}
.watch .what{font-weight:600;line-height:1.3}
.watch .sig{font-size:15px;color:var(--muted)}
.watch .tags{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:2px}
.th{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--rule)}
.th:first-of-type{border-top:0;padding-top:2px}
.th .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.th .name{font-weight:600;line-height:1.3}
.th .p{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.th .claim{font-size:15px;color:var(--muted);margin:0}
.meter{position:relative;height:6px;border-radius:3px;background:var(--bar)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.d-up{color:var(--up)} .d-down{color:var(--down)}
.th .why{font-size:15px;margin:0}
svg.spark{width:84px;height:18px;overflow:visible}
svg.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.5}
svg.spark circle{fill:var(--accent)}
footer{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer a{color:var(--accent)}
footer ul{margin:0;padding-left:18px}
</style>
<style id="fold-theme"></style>

<div class="wrap" id="app" aria-live="polite"></div>
<div class="wrap" style="margin-top:22px">
<!-- REPLY:start -->
<style>
.reply{display:flex;flex-direction:column;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:14px;margin-top:6px}
.reply[hidden]{display:none}
.reply label{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.reply textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:4px;padding:10px;resize:vertical;min-height:4.5em;width:100%;box-sizing:border-box}
.reply textarea:focus-visible,.reply button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reply .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reply button{font-family:var(--mono);font-size:12px;color:var(--page);background:var(--accent);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.reply button:disabled{opacity:.45;cursor:default}
.reply .status{font-size:14px;color:var(--muted);font-style:italic}
.reply ol{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.reply ol li{border-top:1px solid var(--rule);padding-top:8px}
.reply .when{font-family:var(--mono);font-size:11px;color:var(--muted)}
.reply .outcome{color:var(--muted);margin-top:2px}
.reply .outcome b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
</style>
<section class="reply" id="reply" hidden aria-label="Reply to the editor">
  <label for="reply-text">Reply to the editor</label>
  <textarea id="reply-text" rows="3" placeholder="One line is enough. Tomorrow's run reads it."></textarea>
  <div class="bar"><button id="reply-send" type="button" disabled>Send</button><span class="status" id="reply-status" role="status"></span></div>
  <ol id="reply-log" aria-label="Your recent replies"></ol>
</section>
<script>
(async function(){
  const box=document.getElementById('reply');
  if(!box||!window.claude||!claude.use) return;
  const edition=(document.querySelector('meta[name="fold:edition"]')||{}).content||'';
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user||!(await user.isOwner())) return;
  box.hidden=false;
  const text=document.getElementById('reply-text'), send=document.getElementById('reply-send'),
        status=document.getElementById('reply-status'), log=document.getElementById('reply-log');
  const col=db.collection('replies');
  text.addEventListener('input',()=>{ send.disabled=!text.value.trim(); });
  send.addEventListener('click',async()=>{
    const t=text.value.trim(); if(!t) return;
    send.disabled=true; status.textContent='Sending…';
    try{
      await col.add({edition, text:t, sent_at:new Date().toISOString(), status:'new'});
      text.value=''; status.textContent='Sent. Tomorrow’s run reads it.';
    }catch(e){ status.textContent='Not sent. Try again in a moment.'; send.disabled=false; }
  });
  const fmt=s=>{ try{return new Date(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}catch(e){return '';} };
  const timer=setTimeout(()=>{ if(!log.childElementCount) status.textContent='Earlier replies can’t be loaded right now.'; },10000);
  col.orderBy('sent_at','desc').limit(5).onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    log.replaceChildren(...snap.docs.map(d=>{
      const r=d.data()||{}, li=document.createElement('li');
      const w=document.createElement('div'); w.className='when';
      w.textContent=fmt(r.sent_at)+(r.status==='handled'?' · handled':' · waiting for the next run');
      const p=document.createElement('div'); p.textContent=r.text||'';
      li.append(w,p);
      if(r.status==='handled'&&r.outcome){
        const o=document.createElement('div'); o.className='outcome';
        const b=document.createElement('b'); b.textContent='Editor ';
        o.append(b, document.createTextNode(r.outcome)); li.append(o);
      }
      return li;
    }));
  },()=>{ clearTimeout(timer); });
})();
</script>
<!-- REPLY:end -->
</div>

<script type="application/json" id="week">
{
  "sample": true,
  "title": "{{MASTHEAD}}",
  "place": "{{PLACE}}",
  "kind": "Week ahead",
  "issued": "Sunday, 1 March 2026",
  "week_label": "2 – 8 March",
  "lede": "Sample: results week for two fictional insurers, and a regulator's consultation closes.",
  "days": [
    {"date": "2026-03-02", "items": [{"title": "Halcyon Mutual full-year results", "kind": "results", "why": "Watch for a quantified claims-automation figure."}]},
    {"date": "2026-03-03", "items": [{"title": "Northmark Insurance Authority: AI governance roundtable", "kind": "regulatory", "confirmed": false, "why": "Date from search only; where the inventory requirement may soften."}]},
    {"date": "2026-03-04", "items": []},
    {"date": "2026-03-05", "items": [{"title": "Claims & Code conference, day one", "kind": "conference", "why": "Brightwater Re's chief underwriter speaks on AI pricing."}]},
    {"date": "2026-03-06", "items": [{"title": "Corvane Insurance Group trading update", "kind": "results", "why": "First quarter under its new chief executive."}]},
    {"date": "2026-03-07", "items": []},
    {"date": "2026-03-08", "items": []}
  ],
  "later": [
    {"date": "16 Mar", "title": "Claimwise user conference"},
    {"date": "30 Apr", "title": "Consultation on AI governance closes"}
  ],
  "watch": [
    {"what": "Halcyon Mutual's results", "signal": "A production claims-automation figure in the annual report, not only in the press release.", "theses": ["Two large insurers report AI claims savings this year"]}
  ],
  "theses": [
    {"name": "Two large insurers report AI claims savings this year", "claim": "At least two of the ten largest insurers in the market publish a quantified saving from AI claims handling by 31 December 2026.", "p": 0.4, "history": [0.35, 0.4], "resolves": "2026-12-31", "why": "Sample: one insurer reported a figure this week."}
  ],
  "record": {"theses_resolved": 0, "signals_published": 0},
  "sources": [
    {"title": "Every source the edition used", "url": "#"}
  ]
}
</script>

<script>
(function(){
  const W = JSON.parse(document.getElementById('week').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pct = p => Math.round(p * 100);
  function spark(h){
    if (!h || h.length < 2) return '';
    const w = 84, ht = 18, n = h.length;
    const pts = h.map((v,i) => [ (i/(n-1))*w, ht - v*ht ]);
    const last = pts[pts.length-1];
    return `<svg class="spark" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2"/></svg>`;
  }
  function delta(h){
    if (!h || h.length < 2) return '<span>new or unchanged</span>';
    const d = Math.round((h[h.length-1] - h[h.length-2]) * 100);
    if (d === 0) return '<span>→ unchanged</span>';
    return d > 0 ? `<span class="d-up">↑ ${d} pts</span>` : `<span class="d-down">↓ ${-d} pts</span>`;
  }
  const R = W.record || {};
  const recParts = [];
  if (R.theses_resolved) recParts.push(`${R.theses_resolved} thes${R.theses_resolved===1?'is':'es'} resolved, Brier ${Number(R.mean_brier).toFixed(2)} (coin flip 0.25, lower is better)`);
  if (R.signals_published) recParts.push(`${R.signals_published} early signal${R.signals_published===1?'':'s'} published, ${R.signals_confirmed||0} later reported elsewhere${R.median_lead_days!=null?`, median ${R.median_lead_days} days ahead`:''}`);
  const record = `<p class="meta" style="margin-top:14px">Track record · ${recParts.length?recParts.map(esc).join(' · '):'starts when the first thesis resolves or an early signal is published'}</p>`;
  const days = W.days.map(d => {
    const dt = new Date(d.date + 'T12:00:00');
    const items = d.items.length ? d.items.map(it => `<div class="item"><div class="t"><span class="chip k-${esc(it.kind||'other')}">${esc(it.kind||'other')}</span>${esc(it.title)}${it.confirmed===false?'<span class="unconf">date unconfirmed</span>':''}</div>${it.why?`<div class="why">${esc(it.why)}</div>`:''}</div>`).join('')
      : '<div class="none">Nothing scheduled.</div>';
    return `<div class="day${d.items.length?'':' quiet'}"><div><div class="dnum">${dt.getDate()}</div><div class="dname">${DOW[dt.getDay()]}</div></div><div class="items">${items}</div></div>`;
  }).join('');
  const later = (W.later||[]).length ? `<h2 style="margin-top:8px">Further out</h2><div class="later">${W.later.map(l=>`<div><b>${esc(l.date)}</b>${esc(l.title)}</div>`).join('')}</div>` : '';
  const watch = W.watch.map(w => `<li><div><div class="what">${esc(w.what)}</div><div class="sig">${esc(w.signal)}</div>${w.theses&&w.theses.length?`<div class="tags">${w.theses.map(esc).join(' · ')}</div>`:''}</div></li>`).join('');
  const theses = W.theses.map(t => `<div class="th"><div class="row"><div class="name">${esc(t.name)}</div><div class="p">${pct(t.p)}%</div></div>
      <div class="meter" role="img" aria-label="${pct(t.p)} percent"><i style="width:${pct(t.p)}%"></i></div>
      <p class="claim">${esc(t.claim)}</p>
      <div class="meta">${delta(t.history)}${spark(t.history)}<span>resolves ${esc(t.resolves)}</span></div>
      ${t.why?`<p class="why">${esc(t.why)}</p>`:''}</div>`).join('');
  const sources = (W.sources||[]).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
  document.getElementById('app').innerHTML = `
    <header><div class="mast"><span>${esc(W.title)} · ${esc(W.kind)}</span><span>${esc(W.issued)}${W.place?` · ${esc(W.place)}`:''}</span></div>
      <h1>The week of <em>${esc(W.week_label)}</em></h1>${W.lede?`<p class="lede">${esc(W.lede)}</p>`:''}</header>
    <div class="grid">
      <section aria-label="Agenda"><h2>The week ahead</h2>${days}${later}</section>
      <div style="display:flex;flex-direction:column;gap:22px;min-width:0">
        <section aria-label="Watch list"><h2>Watch list</h2><ol class="watch">${watch}</ol></section>
        <section aria-label="Theses"><h2>Theses</h2>${theses}${record}</section>
      </div>
    </div>
    ${sources?`<footer><span>Sources</span><ul>${sources}</ul></footer>`:''}`;
})();
</script>
